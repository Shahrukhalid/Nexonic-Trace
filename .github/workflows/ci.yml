name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend and responsive UI
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm audit --audit-level=high
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run tauri -- build --no-bundle
      - name: Reject unsigned production executables
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_EXPECTED_PUBLISHER: Unsigned validation fixture
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/sign_windows.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'Production signing script has syntax errors' }
          try {
            ./scripts/sign_windows.ps1 -Action Verify -Path target/release/nexonic-trace.exe
            throw 'Unsigned executable was accepted'
          } catch {
            if ($_.Exception.Message -notlike '*trusted, timestamped Authenticode*') { throw }
          }
      - name: Verify actual release startup
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python scripts/release_smoke.py target/release/nexonic-trace.exe
          else
            python3 scripts/release_smoke.py target/release/nexonic-trace
          fi
